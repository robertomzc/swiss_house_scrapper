[tool.poetry]
name = "housing_scrapper"
version = "0.1.0"
description = "Email-first housing monitoring project"
authors = ["Roberto Martinez <robertomzc@gmail.com>"]
license = "MIT"
packages = [{ include = "housing_monitor", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.4"
beautifulsoup4 = "^4.12.3"
playwright = "^1.50.0"
pytest = "^8.3.0"
pyyaml = "^6.0.3"
python-dotenv = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.poetry.scripts]
housing-monitor = "housing_monitor.pipeline:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"