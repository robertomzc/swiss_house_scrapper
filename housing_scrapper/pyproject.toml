[tool.poetry]
name = "housing_scrapper"
version = "0.1.0"
description = "A small repository to scrap housing from the web"
authors = ["Roberto Martinez <robertomzc@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
