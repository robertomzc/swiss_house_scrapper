[metadata]
name = housing_scrapper
version = 0.1.0
description = Email-first housing monitoring project
author = Roberto Martinez
author_email = robertomzc@gmail.com
license = MIT

[options]
packages = find:
package_dir =
    = src
install_requires =
    requests>=2.32.4
    pyyaml>=6.0.3

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests

[flake8]
max-line-length = 88
extend-ignore = E203, W503